
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIP 帳號設定</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f0f4f8;font-family:'Noto Sans TC',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,0.10);max-width:400px;width:100%;overflow:hidden}
  .header{background:linear-gradient(135deg,#1565c0,#0d47a1);padding:24px 20px;text-align:center;color:#fff}
  .header h1{font-size:20px;font-weight:700;margin-bottom:4px}
  .header p{font-size:13px;opacity:0.85}
  .qr-wrap{display:flex;justify-content:center;padding:24px 0 8px}
  .qr-box{background:#fff;border:2px solid #e3eaf2;border-radius:14px;padding:12px;display:inline-block}
  .qr-hint{text-align:center;font-size:12px;color:#90a4ae;margin-bottom:20px}
  .divider{border:none;border-top:1px solid #e3eaf2;margin:0 20px}
  .fields{padding:20px}
  .fields h2{font-size:13px;color:#90a4ae;font-weight:500;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.05em}
  .field{background:#f5f8ff;border:1px solid #dce8ff;border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .field-label{font-size:11px;color:#1565c0;font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.05em}
  .field-value{font-size:16px;color:#1a237e;font-weight:600;letter-spacing:0.02em;display:flex;align-items:center;justify-content:space-between}
  .copy-btn{background:#1565c0;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:background 0.15s}
  .copy-btn:active{background:#0d47a1}
  .notice{background:#fff8e1;border:1px solid #ffe082;border-radius:10px;padding:12px 14px;margin-top:4px}
  .notice-label{font-size:11px;color:#f57f17;font-weight:700;margin-bottom:4px}
  .notice-text{font-size:13px;color:#5d4037;line-height:1.6}
  .footer{padding:16px 20px;text-align:center;font-size:11px;color:#b0bec5}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <h1>📡 SIP 帳號設定資料</h1>
    <p>掃描二維碼或對照以下資料填入</p>
  </div>

  <div class="qr-wrap">
    <div class="qr-box"><div id="qr"></div></div>
  </div>
  <p class="qr-hint">掃碼可開啟此頁面</p>

  <hr class="divider">

<div class="field">
<div class="field-label">🔑 激活碼</div>
<div class="field-value">SM8N-ERNO-90Y0-PF6E <button class="copy-btn" onclick="copy('SM8N-ERNO-90Y0-PF6E',this)">複製</button></div>
</div>

  <div class="fields">
    <h2>填入順序</h2>

    <div class="field">
      <div class="field-label">① SIP 帳號</div>
      <div class="field-value">004 <button class="copy-btn" onclick="copy('004',this)">複製</button></div>
    </div>

    <div class="field">
      <div class="field-label">② SIP 密碼</div>
      <div class="field-value">112233 <button class="copy-btn" onclick="copy('112233',this)">複製</button></div>
    </div>

    <div class="field">
      <div class="field-label">③ SIP 服務器地址和端口</div>
      <div class="field-value">47.83.16.179:4321 <button class="copy-btn" onclick="copy('47.83.16.179:4321',this)">複製</button></div>
    </div>

    <div class="notice">
      <div class="notice-label">⚠️ 注意</div>
      <div class="notice-text">「被叫號碼位置」選項請<strong>勾選</strong>（From 頭域），然後點擊「確定」完成設定。</div>
    </div>
  </div>

  <div class="footer">填寫完畢後點擊確定即可完成設定</div>
</div>

<script>
const pageUrl = window.location.href;
new QRCode(document.getElementById("qr"), {
  text: pageUrl,
  width: 180, height: 180,
  colorDark: "#0d47a1", colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const orig = btn.textContent;
    btn.textContent = '✓ 已複製';
    btn.style.background = '#43a047';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; }, 1500);
  });
}
</script>
</body>
</html>
